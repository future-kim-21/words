<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주먹펴고 일어서</title>
<style>
:root{
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#f2f5fa; --ink-soft:rgba(242,245,250,.62);
  --glass:rgba(38,44,56,.55); --glass-strong:rgba(48,55,69,.72);
  --edge:rgba(255,255,255,.22); --edge-soft:rgba(255,255,255,.12);
  --shadow:0 12px 40px rgba(0,0,0,.45);
  --accent:#64a8ff;
  --ok:#4ade80; --ok-bg:rgba(48,209,88,.18); --ok-edge:rgba(48,209,88,.45);
  --no:#ff7b8b; --no-bg:rgba(255,69,88,.16); --no-edge:rgba(255,69,88,.42);
  --b1:#2b4a86; --b2:#6a2f63; --b3:#1f5b52; --b4:#7a4a20; --page:#0d1016;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; overflow-y:scroll; scrollbar-gutter:stable}
body{margin:0; min-height:100%; color:var(--ink); background:var(--page);
  font-family:-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; overflow-x:hidden}
.bg{position:fixed; inset:-20vh -20vw; z-index:-1; overflow:hidden; pointer-events:none}
.bg span{position:absolute; border-radius:50%; filter:blur(70px); opacity:.75; animation:drift 26s ease-in-out infinite}
.bg span:nth-child(1){width:60vmax;height:60vmax;background:var(--b1);top:-10%;left:-10%}
.bg span:nth-child(2){width:48vmax;height:48vmax;background:var(--b2);top:20%;right:-12%;animation-delay:-7s}
.bg span:nth-child(3){width:52vmax;height:52vmax;background:var(--b3);bottom:-14%;left:10%;animation-delay:-13s}
.bg span:nth-child(4){width:38vmax;height:38vmax;background:var(--b4);bottom:6%;right:6%;animation-delay:-19s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,-3vh) scale(1.08)}66%{transform:translate(-3vw,4vh) scale(.95)}}
@media (prefers-reduced-motion:reduce){.bg span{animation:none}}
.app{max-width:760px; margin:0 auto; padding:26px 16px 70px}
.hidden{display:none!important}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft)}
.glass{position:relative; background:var(--glass); -webkit-backdrop-filter:blur(30px) saturate(190%); backdrop-filter:blur(30px) saturate(190%);
  border:1px solid var(--edge); border-radius:26px; box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.45)}
.btn{display:block;width:100%;font:inherit;font-size:16px;font-weight:700;color:inherit;cursor:pointer;padding:15px;border-radius:18px;
  background:var(--glass-strong);border:1px solid var(--edge);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .16s cubic-bezier(.22,1,.36,1)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:linear-gradient(145deg,var(--accent),color-mix(in srgb,var(--accent) 75%, #6f4bff)); color:#fff; border-color:transparent}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-soft);font-weight:600;font-size:14px;padding:12px}
.btn-outline{background:transparent}

/* 홈 */
.home-head{text-align:center; margin:10px 0 24px}
.home-head h1{font-size:26px; font-weight:800; letter-spacing:-.03em; margin:0}
.home-head p{margin:4px 0 0; color:var(--ink-soft); font-size:14px}
.school-list{display:flex;flex-direction:column;gap:16px}
div.school{background:var(--glass-strong);border:1px solid var(--edge);border-radius:26px;overflow:hidden;
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.45)}
.s-head{width:100%;font:inherit;color:inherit;text-align:left;background:transparent;border:0;cursor:pointer;user-select:none;padding:20px 22px;display:flex;align-items:center;gap:12px;transition:transform .18s cubic-bezier(.22,1,.36,1)}
.s-head:active{transform:scale(.985)}
.s-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1), opacity .3s ease}
.s-panel>div{overflow:hidden}
.school.open .s-panel{grid-template-rows:1fr;opacity:1}
.s-ico{flex:none;width:38px;height:38px;border-radius:14px;display:grid;place-items:center;font-size:19px;
  background:linear-gradient(145deg, rgba(255,255,255,.7), rgba(255,255,255,.25));border:1px solid var(--edge-soft)}
.s-ico img{width:34px;height:34px;object-fit:contain;display:block}
.s-title{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.35}
.s-name{font-size:19px;font-weight:700;letter-spacing:-.02em}
.s-side{display:flex;align-items:center;flex:none}
.s-count{font-size:14px;color:var(--ink-soft);font-weight:600}
.s-arrow{margin-left:10px;color:var(--ink-soft);display:inline-block;transition:transform .32s cubic-bezier(.22,1,.36,1)}
.school.open .s-arrow{transform:rotate(90deg)}
.school-body{padding:0 18px 20px}
.desc{font-size:13.5px;color:var(--ink-soft);margin-bottom:14px;line-height:1.5}
.desc b{color:var(--accent)}
.dir-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px;padding:4px;border-radius:18px;
  background:var(--glass);border:1px solid var(--edge-soft)}
.dir{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);background:transparent;border:0;border-radius:14px;
  padding:8px 0;line-height:1.3;cursor:pointer;white-space:nowrap;transition:background .2s, color .2s, transform .15s}
.dir small{display:block;font-size:11px;font-weight:600;opacity:.75;margin-top:1px}
.dir:hover{color:var(--ink)}
.dir:active{transform:scale(.97)}
.dir.on{background:var(--accent);color:#fff;font-weight:700}
.section-label{font-size:13px;font-weight:700;color:var(--ink-soft);margin:14px 4px 8px}
.chip{font:inherit;color:inherit;cursor:pointer;text-align:center;min-width:0;padding:12px 4px;border-radius:17px;
  font-size:clamp(12.5px,3.1vw,15px);font-weight:600;line-height:1.3;word-break:keep-all;
  background:var(--glass);border:1px solid var(--edge-soft);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 6px 20px rgba(24,34,60,.1), inset 0 1px 0 rgba(255,255,255,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform .18s cubic-bezier(.22,1,.36,1), border-color .2s, background .2s}
.chip small{font-size:clamp(10.5px,2.2vw,12px);font-weight:500;color:var(--ink-soft);margin-top:2px}
.chip:hover{border-color:var(--accent)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--accent);border-color:transparent;color:#fff}
.chip.on small{color:rgba(255,255,255,.85)}
.chip.big{width:100%;padding:12px 0;font-size:14.5px;flex-direction:row}
.chip-disabled{opacity:.4;cursor:not-allowed}
.all-row{margin:0 0 6px}
.all-row .chip{display:inline-flex;flex-direction:row;gap:6px;padding:7px 14px;border-radius:12px;font-size:13px}
.all-row .chip small{margin-top:0;font-size:11px}
.rowFlex.days{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.rowFlex.days .chip{flex:1 1 0;min-width:64px;max-width:88px;width:auto;padding:7px 2px;border-radius:12px;font-size:13px}
.rowFlex.days .chip small{font-size:10.5px;margin-top:0}
.rowFlex.days.five{display:grid;grid-template-columns:repeat(5,88px)}
.rowFlex.days.five .chip{width:auto;max-width:none;min-width:0}
@media (max-width:520px){
  .rowFlex.days,.rowFlex.days.five{display:grid;grid-template-columns:repeat(var(--mc,3),1fr)}
  .rowFlex.days .chip{width:auto;min-width:0;max-width:none}
}
.count-picker{margin-top:16px}
.count-picker input{width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;padding:15px;color:var(--ink);
  border-radius:18px;background:var(--glass);border:1px solid var(--edge-soft)}
.count-picker input:focus{outline:none;border-color:var(--accent)}
.count-picker input::placeholder{color:var(--ink-soft);font-weight:600}
.count-picker .btn{margin-top:10px}
.count-err{margin-top:8px;font-size:13px;font-weight:700;color:var(--no);text-align:center;min-height:18px}

/* 퀴즈 */
.quiz-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.lesson-name{font-size:13.5px;font-weight:600;color:var(--ink-soft);padding:8px 15px;border-radius:999px;
  background:var(--glass);border:1px solid var(--edge-soft)}
.progress-card{display:flex;gap:12px;align-items:center;padding:14px 18px;margin-bottom:14px}
.progress-badge{flex:none;width:38px;height:38px;border-radius:999px;border:2px solid var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums}
.progress-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.progress-row{display:flex;align-items:baseline;gap:8px}
.progress-pct{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.progress-num{font-size:12px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--edge-soft);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.qcard{padding:22px}
.word-card{text-align:center;padding:34px 12px 30px;border-radius:20px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.7)}
.word-card .eyebrow{margin-bottom:10px}
.word-card .word{font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.02em;word-break:break-word;line-height:1.25}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:18px}
.choice{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;cursor:pointer;
  font:inherit;font-size:16px;color:inherit;padding:15px 16px;border-radius:19px;
  background:var(--glass);border:1px solid var(--edge-soft);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);transition:transform .16s cubic-bezier(.22,1,.36,1), background .2s, border-color .2s}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice:active:not(:disabled){transform:scale(.985)}
.choice:disabled{cursor:default}
.choice .key{flex:none;font-weight:800;color:var(--ink-soft)}
.choice.picked{border-color:var(--accent);background:rgba(100,168,255,.18)}
.choice.picked .key{color:var(--accent)}
.choice.correct{background:var(--ok-bg);border-color:var(--ok-edge)}
.choice.correct .key{color:var(--ok)}
.choice.wrong{background:var(--no-bg);border-color:var(--no-edge)}
.choice.wrong .key{color:var(--no)}
.write-box{display:flex;flex-direction:column;gap:10px}
.write-box input{width:100%;font:inherit;font-size:22px;font-weight:700;text-align:center;padding:15px;color:var(--ink);
  border-radius:18px;background:var(--glass);border:1px solid var(--edge-soft)}
.write-box input:focus{outline:none;border-color:var(--accent)}
.write-box input::placeholder{color:var(--ink-soft);font-weight:600;font-size:16px}
.write-box input.ok{border-color:var(--ok-edge);background:var(--ok-bg)}
.write-box input.no{border-color:var(--no-edge);background:var(--no-bg)}
.write-fb{text-align:center;font-size:15px;font-weight:700;min-height:24px}
.write-fb.ok{color:var(--ok)}
.write-fb.no{color:var(--no)}
.write-fb .ans{color:var(--ink);font-size:19px;font-weight:800;margin-left:6px}

/* 결과 */
.result-head{text-align:center;padding:30px 20px}
.result-head .score{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:6px 0 2px}
.result-head .score small{font-size:22px;color:var(--ink-soft);font-weight:700}
.result-head .msg{color:var(--ink-soft);font-size:15px}
.review{margin-top:16px}
.review details{margin-bottom:10px}
.review summary{list-style:none;cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;
  padding:14px 16px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--edge)}
.review summary::-webkit-details-marker{display:none}
.review summary .arrow{font-size:12px;color:var(--ink-soft);transition:transform .2s}
.review details[open] summary .arrow{transform:rotate(90deg)}
.rv-body{padding-top:8px}
.rv{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:7px;border-radius:14px;
  background:var(--glass);border:1px solid var(--edge-soft)}
.rv.no{background:var(--no-bg);border-color:var(--no-edge)}
.rv.ok{background:var(--ok-bg);border-color:var(--ok-edge)}
.rv .mark{flex:none;font-weight:800}
.rv.ok .mark{color:var(--ok)} .rv.no .mark{color:var(--no)}
.rv .body{flex:1;min-width:0}
.rv .w{font-weight:700;font-size:15px}
.rv .m{color:var(--ink-soft);font-size:13.5px;margin-top:2px}
.rv .chosen{color:var(--no);font-size:13px;margin-top:2px}
.result-actions{margin-top:20px;display:flex;flex-direction:column;gap:10px}
#pdfReadyLink{text-decoration:none;text-align:center;background:linear-gradient(145deg,#2fbf6a,#1e9e55);color:#fff;border-color:transparent}
@media (max-width:520px){.app{padding:20px 13px 60px}.home-head h1{font-size:23px}.s-head{padding:18px}.s-name{font-size:17px}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="bg"><span></span><span></span><span></span><span></span></div>
<div class="app">

  <div id="screen-home">
    <header class="home-head">
      <h1>주먹펴고 일어서</h1>
      <p>범위를 고르고 시험 볼 단어 수를 입력하세요</p>
    </header>
    <div class="school-list" id="bookList"></div>
  </div>

  <div id="screen-quiz" class="hidden">
    <div class="quiz-top"><span class="lesson-name" id="quizLessonName"></span></div>
    <div class="glass progress-card">
      <div class="progress-badge" id="progressBadge">1</div>
      <div class="progress-info">
        <div class="progress-row"><span class="progress-pct" id="progressPct">0%</span><span class="progress-num" id="progressNum"></span></div>
        <div class="track"><div class="fill" id="progressFill"></div></div>
      </div>
    </div>
    <div class="glass qcard">
      <div class="word-card">
        <div class="eyebrow" id="quizEyebrow">다음 단어의 뜻은?</div>
        <div class="word" id="quizWord"></div>
      </div>
      <div class="choices" id="choices"></div>
    </div>
    <button class="btn btn-ghost" id="quitBtn">그만하기</button>
  </div>

  <div id="screen-result" class="hidden">
    <div class="glass result-head">
      <div class="eyebrow" id="resultLesson"></div>
      <div class="score"><span id="scoreNum"></span><small id="scoreTotal"></small></div>
      <div class="msg" id="scoreMsg"></div>
    </div>
    <div class="review" id="reviewList"></div>
    <div class="result-actions">
      <button class="btn btn-outline" id="savePdf">📄 틀린 단어 PDF 저장</button>
      <button class="btn btn-primary" id="retryWrong">틀린 단어만 다시</button>
      <button class="btn btn-outline" id="retryAll">전체 다시 풀기</button>
      <button class="btn btn-ghost" id="goHome">처음으로</button>
    </div>
  </div>

</div>

  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function parseWords(txt, day){
    var out=[];
    String(txt||'').split(/\r?\n/).forEach(function(line){
      var p=line.split('\t');
      if(p.length<2) return;
      var en=p[0].trim(), ko=p.slice(1).join(' ').trim();
      if(en && ko) out.push({en:en, ko:ko, day:day});
    });
    return out;
  }
  BOOKS.forEach(function(b){
    b.days=[];
    b.sections.forEach(function(sec, si){
      sec.days.forEach(function(d){ d.key=si+'|'+d.name; d.list=parseWords(d.words, d.name); b.days.push(d); });
    });
  });

  function show(name){
    ['home','quiz','result'].forEach(function(n){ $('screen-'+n).classList.toggle('hidden', n!==name); });
    window.scrollTo(0,0);
  }

  /* ══════════ 홈 ══════════ */
  function buildHome(){
    var host=$('bookList'); host.innerHTML='';
    BOOKS.forEach(function(b, bi){
      var total=b.days.reduce(function(s,d){ return s+d.list.length; },0);
      var usable=b.days.filter(function(d){ return d.list.length; });
      var sel={};

      var det=document.createElement('div'); det.className='school'+(BOOKS.length===1?' open':'');
      det.innerHTML=
        '<button class="s-head" type="button"><span class="s-ico">'+(b.iconImg?'<img src="'+b.iconImg+'" alt="">':'📗')+'</span>'+
        '<span class="s-title"><span class="s-name">'+esc(b.title)+'</span></span>'+
        '<span class="s-side"><span class="s-count">'+total.toLocaleString()+'단어</span> <span class="s-arrow">›</span></span></button>'+
        '<div class="s-panel"><div><div class="school-body">'+
          '<div class="desc">전체 '+total.toLocaleString()+'단어 · 선택한 범위 <b data-role="count2">0</b>개 단어에서 무작위 출제</div>'+
          '<div class="dir-row">'+
            '<button class="dir on" data-dir="EK">영어 → 한글<small>객관식</small></button>'+
            '<button class="dir" data-dir="KE">한글 → 영어<small>객관식</small></button>'+
            '<button class="dir" data-dir="INSTANT">⚡ 즉시 확인<small>객관식</small></button>'+
            '<button class="dir" data-dir="WR">✍️ 한글 → 영어<small>주관식</small></button>'+
          '</div>'+
          '<div data-role="range"></div>'+
          '<div class="count-picker">'+
            '<input type="number" min="1" inputmode="numeric" placeholder="예: 30" data-role="countInput">'+
            '<button class="btn btn-primary" data-role="startBtn">시험 시작</button>'+
            '<div class="count-err" data-role="countErr"></div>'+
          '</div>'+
        '</div></div></div>';
      host.appendChild(det);
      det.querySelector('.s-head').onclick=function(){ det.classList.toggle('open'); };

      var area=det.querySelector('[data-role="range"]');
      var count2=det.querySelector('[data-role="count2"]');
      var inp=det.querySelector('[data-role="countInput"]');
      var err=det.querySelector('[data-role="countErr"]');
      var startBtn=det.querySelector('[data-role="startBtn"]');

      var dir='EK', instant=false;
      var dirBtns=[].slice.call(det.querySelectorAll('.dir'));
      dirBtns.forEach(function(x){
        x.onclick=function(){
          instant=(x.dataset.dir==='INSTANT');
          dir=instant?'MIX':x.dataset.dir;
          dirBtns.forEach(function(y){ y.classList.toggle('on', y===x); });
        };
      });

      function mk(html, cls){ var c=document.createElement('button'); c.className=cls; c.innerHTML=html; return c; }

      var master=mk('✅ 전체 단어 선택 / 해제','chip big');
      area.appendChild(master);

      var refs=[], secRefs=[];
      b.sections.forEach(function(sec){
        var sUse=sec.days.filter(function(d){ return d.list.length; });
        var sTot=sec.days.reduce(function(s,d){ return s+d.list.length; },0);
        var lab=document.createElement('div'); lab.className='section-label'; lab.textContent=sec.label;
        area.appendChild(lab);
        var allC=mk('전체<small>'+sTot+'</small>','chip');
        var allRow=document.createElement('div'); allRow.className='all-row';
        allRow.appendChild(allC); area.appendChild(allRow);
        allC.onclick=function(){
          var on=sUse.length && sUse.every(function(d){ return sel[d.key]; });
          sUse.forEach(function(d){ sel[d.key]=!on; }); sync();
        };
        secRefs.push({c:allC, use:sUse});
        var row=document.createElement('div'); row.className='rowFlex days';
        var nChips=sec.days.length;
        if(nChips>9 && nChips%5===0) row.classList.add('five');
        row.style.setProperty('--mc', nChips%3===0?3:(nChips%5===0?5:(nChips%4===0?4:3)));
        sec.days.forEach(function(d){
          var off=!d.list.length;
          var c=mk(esc(d.name)+'<small>'+(off?'준비 중':d.list.length)+'</small>','chip'+(off?' chip-disabled':''));
          if(off) c.disabled=true;
          else c.onclick=function(){ sel[d.key]=!sel[d.key]; sync(); };
          row.appendChild(c);
          refs.push({d:d,c:c});
        });
        area.appendChild(row);
      });

      function allOn(){ return usable.length>0 && usable.every(function(d){ return sel[d.key]; }); }
      master.onclick=function(){ var on=allOn(); usable.forEach(function(d){ sel[d.key]=!on; }); sync(); };

      function pool(){ var p=[]; usable.forEach(function(d){ if(sel[d.key]) p=p.concat(d.list); }); return p; }
      function sync(){
        master.classList.toggle('on',allOn());
        secRefs.forEach(function(x){ x.c.classList.toggle('on', x.use.length>0 && x.use.every(function(d){ return sel[d.key]; })); });
        refs.forEach(function(r){ r.c.classList.toggle('on', !!sel[r.d.key]); });
        count2.textContent=pool().length.toLocaleString();
        err.textContent='';
      }
      function go(){
        var p=pool();
        if(!p.length){ err.textContent='범위를 하나 이상 선택하세요.'; return; }
        var n=parseInt(inp.value,10);
        if(!n||n<1){ err.textContent='1 이상의 숫자를 입력하세요.'; inp.focus(); return; }
        if(n>p.length){ err.textContent='선택한 범위에서는 최대 '+p.length.toLocaleString()+'문제까지 가능해요.'; return; }
        err.textContent='';
        var names=[];
        b.sections.forEach(function(sec){
          var ds=sec.days.filter(function(d){ return d.list.length && sel[d.key]; });
          if(!ds.length) return;
          var short=sec.label.replace(/^[^—]+ — /,'');
          var su=sec.days.filter(function(d){ return d.list.length; });
          names.push(short+' '+(ds.length===su.length?'전체':ds.map(function(d){ return d.name; }).join('·')));
        });
        var all=[]; b.days.forEach(function(d){ all=all.concat(d.list); });
        startQuiz(b.title+' · '+(allOn()?'전체':names.join(' / ')), shuffle(p.slice()).slice(0,n), dir, all, instant);
      }
      startBtn.onclick=go;
      inp.onkeydown=function(e){ if(e.key==='Enter') go(); };
      inp.oninput=function(){ err.textContent=''; };
      sync();
    });
  }

  /* ══════════ 퀴즈 ══════════ */
  var state=null;
  function startQuiz(lessonName, words, dir, schoolAll, instant){
    state={
      lessonName:lessonName, dir:dir||'EK', instant:!!instant,
      pool:words, queue:shuffle(words.slice()),
      idx:0, correct:0, wrong:[], records:[],
      schoolAll:schoolAll||words
    };
    $('quizLessonName').textContent=lessonName;
    show('quiz');
    renderQuestion();
  }
  function setProgress(done){
    var n=state.queue.length;
    $('progressNum').textContent=(state.idx+1)+' / '+n;
    $('progressBadge').textContent=state.idx+1;
    $('progressPct').textContent=Math.round(done/n*100)+'%';
    $('progressFill').style.width=(done/n*100)+'%';
  }
  function next(delay){
    state.advanceTimer=setTimeout(function(){
      state.idx++;
      if(state.idx>=state.queue.length) showResult(); else renderQuestion();
    }, delay);
  }
  function renderQuestion(){
    var q=state.queue[state.idx];
    setProgress(state.idx);
    state.qDir= state.dir==='MIX' ? (Math.random()<.5?'EK':'KE') : state.dir;
    if(state.qDir==='WR'){ renderWrite(q); return; }
    var EK= state.qDir==='EK';
    $('quizEyebrow').textContent= EK ? '다음 단어의 뜻은?' : '다음 뜻의 영단어는?';
    $('quizWord').textContent= EK ? q.en : q.ko;
    $('quizWord').style.fontSize= EK ? '' : 'clamp(20px,5.4vw,26px)';

    /* 뜻이 겹치는 단어(유의어)는 오답 보기에서 제외 → 복수정답 방지 */
    var qTok={}; q.ko.split(/[,/]/).forEach(function(t){ t=t.trim(); if(t) qTok[t]=1; });
    var overlaps=function(x){ return x.ko.split(/[,/]/).some(function(t){ return qTok[t.trim()]; }); };
    var used={}; used[EK?q.ko:q.en]=1;
    var cands=shuffle(state.schoolAll.filter(function(x){ return x.en!==q.en && x.ko!==q.ko && !overlaps(x); }));
    var opts=[EK?q.ko:q.en];
    for(var i=0;i<cands.length && opts.length<4;i++){
      var v=EK?cands[i].ko:cands[i].en;
      if(!used[v]){ used[v]=1; opts.push(v); }
    }
    opts=shuffle(opts);
    var box=$('choices'); box.innerHTML='';
    opts.forEach(function(o,i){
      var btn=document.createElement('button'); btn.className='choice'; btn.dataset.val=o;
      btn.innerHTML='<span class="key">'+['①','②','③','④'][i]+'</span><span>'+esc(o)+'</span>';
      btn.onclick=function(){ answer(btn, o, q); };
      box.appendChild(btn);
    });
  }
  function answer(btn, chosen, q){
    var buttons=[].slice.call($('choices').children);
    buttons.forEach(function(b){ b.disabled=true; });
    var correctAnswer= state.qDir==='EK' ? q.ko : q.en;
    var ok= chosen===correctAnswer;
    if(state.instant){
      btn.classList.add(ok?'correct':'wrong');
      if(!ok) buttons.forEach(function(b){ if(b.dataset.val===correctAnswer) b.classList.add('correct'); });
    } else {
      btn.classList.add('picked');
    }
    if(ok) state.correct++; else state.wrong.push(q);
    state.records.push({en:q.en, ko:q.ko, chosen:chosen, ok:ok, d:state.qDir});
    setProgress(state.idx+1);
    next(!state.instant ? 350 : (ok ? 1000 : 2200));
  }

  /* 주관식: 한글 뜻 → 영어 직접 입력, 제출 즉시 정답 확인 (힌트 없음) */
  function normAns(t){ return String(t||'').toLowerCase().replace(/[’`]/g,"'").replace(/\s+/g,' ').trim(); }
  function renderWrite(q){
    $('quizEyebrow').textContent='다음 뜻의 영단어를 쓰세요';
    $('quizWord').textContent=q.ko;
    $('quizWord').style.fontSize='clamp(20px,5.4vw,26px)';
    var box=$('choices'); box.innerHTML=
      '<div class="write-box">'+
        '<input id="writeIn" type="text" lang="en" inputmode="email" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="영어로 입력">'+
        '<div class="write-fb" id="writeFb"></div>'+
        '<button class="btn btn-primary" id="writeGo">확인</button>'+
      '</div>';
    var inp=$('writeIn');
    function submit(){
      if(inp.disabled) return;
      var v=inp.value.trim();
      if(!v){ inp.focus(); return; }
      inp.disabled=true;
      var ok= normAns(v)===normAns(q.en);
      inp.classList.add(ok?'ok':'no');
      var fb=$('writeFb');
      fb.className='write-fb '+(ok?'ok':'no');
      fb.innerHTML= ok ? '⭕ 정답!' : '❌ 오답 · 정답<span class="ans">'+esc(q.en)+'</span>';
      if(ok) state.correct++; else state.wrong.push(q);
      state.records.push({en:q.en, ko:q.ko, chosen:v, ok:ok, d:'WR'});
      setProgress(state.idx+1);
      var go=$('writeGo');
      go.textContent= state.idx+1>=state.queue.length ? '결과 보기' : '다음 문제';
      go.onclick=goNext;
      setTimeout(function(){ go.focus(); }, 30);
    }
    var moved=false;
    function goNext(){ if(moved) return; moved=true; next(0); }
    $('writeGo').onclick=submit;
    inp.onkeydown=function(e){ if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); submit(); } };
    setTimeout(function(){ inp.focus(); }, 30);
  }

  /* 그만하기: 두 번 누르기 */
  var quitArmed=null;
  $('quitBtn').onclick=function(){
    if(quitArmed){
      clearTimeout(quitArmed); quitArmed=null;
      if(state && state.advanceTimer) clearTimeout(state.advanceTimer);
      $('quitBtn').textContent='그만하기';
      show('home'); return;
    }
    $('quitBtn').textContent='정말 그만할까요? 한 번 더 누르면 처음으로';
    quitArmed=setTimeout(function(){ quitArmed=null; $('quitBtn').textContent='그만하기'; },3000);
  };

  /* 키보드 1~4 (숫자패드 포함) */
  document.addEventListener('keydown',function(e){
    if($('screen-quiz').classList.contains('hidden')) return;
    if(state && state.qDir==='WR') return;
    var n=null;
    if(e.key>='1' && e.key<='4') n=+e.key;
    if(e.code && e.code>='Numpad1' && e.code<='Numpad4') n=+e.code.slice(-1);
    if(!n) return;
    var btn=$('choices').children[n-1];
    if(btn && !btn.disabled) btn.click();
  });

  /* ══════════ 결과 ══════════ */
  function showResult(){
    var total=state.queue.length, score=state.correct, pct=Math.round(score/total*100);
    $('resultLesson').textContent=state.lessonName;
    $('scoreNum').textContent=score;
    $('scoreTotal').textContent=' / '+total;
    $('scoreMsg').textContent=
      pct===100 ? '완벽해요! 🏆' :
      pct>=80 ? '잘했어요! 틀린 것만 한 번 더 👍' :
      pct>=50 ? '절반은 넘었어요. 틀린 단어 복습 필수!' :
      '괜찮아요, 지금부터 외우면 돼요 💪';
    var wrongs=state.records.filter(function(r){ return !r.ok; });
    var rights=state.records.filter(function(r){ return r.ok; });
    var h='';
    if(wrongs.length){
      h+='<details open><summary><span class="arrow">▶</span>❌ 틀린 단어 '+wrongs.length+'개</summary><div class="rv-body">'+
        wrongs.map(function(r){
          var ek=r.d==='EK';
          return '<div class="rv no"><span class="mark">✗</span><div class="body">'+
            '<div class="w">'+esc(ek?r.en:r.ko)+'</div>'+
            '<div class="chosen">'+(r.d==='WR'?'내가 쓴 답: ':'내가 고른 답: ')+esc(r.chosen)+'</div>'+
            '<div class="m">정답: '+esc(ek?r.ko:r.en)+'</div></div></div>';
        }).join('')+'</div></details>';
    }
    if(rights.length){
      h+='<details><summary><span class="arrow">▶</span>⭕ 맞은 단어 '+rights.length+'개</summary><div class="rv-body">'+
        rights.map(function(r){
          return '<div class="rv ok"><span class="mark">✓</span><div class="body"><div class="w">'+esc(r.en)+'</div><div class="m">'+esc(r.ko)+'</div></div></div>';
        }).join('')+'</div></details>';
    }
    $('reviewList').innerHTML=h;
    $('retryWrong').classList.toggle('hidden', !wrongs.length);
    $('savePdf').classList.toggle('hidden', !wrongs.length);
    var old=document.getElementById('pdfReadyLink'); if(old) old.remove();
    show('result');
  }
  $('retryWrong').onclick=function(){
    var ww=state.wrong.slice();
    var words= ww.length>=4 ? ww : ww.concat(shuffle(state.pool.filter(function(x){ return ww.indexOf(x)<0; })).slice(0,4-ww.length));
    startQuiz(state.lessonName.replace(/ \(오답\)$/,'')+' (오답)', words, state.dir, state.schoolAll, state.instant);
  };
  $('retryAll').onclick=function(){ startQuiz(state.lessonName.replace(/ \(오답\)$/,''), state.pool, state.dir, state.schoolAll, state.instant); };
  $('goHome').onclick=function(){ show('home'); };

  /* ══════════ 틀린 단어 PDF 저장 ══════════ */
  $('savePdf').onclick=function(){
    var wrongs=state.records.filter(function(r){ return !r.ok; });
    if(!wrongs.length) return;
    var btn=$('savePdf');
    if(!window.html2canvas || !window.jspdf){ btn.textContent='저장 실패 — 다시 시도해주세요'; setTimeout(function(){ btn.textContent='📄 틀린 단어 PDF 저장'; },2500); return; }
    btn.disabled=true; btn.textContent='PDF 만드는 중...';
    var t=new Date();
    var dateStr=t.getFullYear()+'.'+String(t.getMonth()+1).padStart(2,'0')+'.'+String(t.getDate()).padStart(2,'0');
    var sheet=document.createElement('div');
    sheet.style.cssText="position:fixed;left:-9999px;top:0;width:794px;background:#fff;color:#1F2733;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:48px 56px;box-sizing:border-box";
    sheet.innerHTML=
      '<div style="border-bottom:3px solid #1F2733;padding-bottom:14px;margin-bottom:6px">'+
        '<div style="font-size:13px;font-weight:700;color:#6B7484;letter-spacing:.1em">오답 노트 · '+dateStr+'</div>'+
        '<div style="font-size:26px;font-weight:800;margin-top:4px">'+esc(state.lessonName)+' — 틀린 단어 '+wrongs.length+'개</div>'+
      '</div>'+
      wrongs.map(function(r,i){
        return '<div style="display:flex;align-items:baseline;gap:14px;padding:12px 2px;border-bottom:1px solid #E6E4DC">'+
          '<div style="flex:none;width:30px;font-size:13px;font-weight:800;color:#6B7484">'+(i+1)+'</div>'+
          '<div style="flex:1;font-size:18px;font-weight:800">'+esc(r.en)+'</div>'+
          '<div style="flex:1.4;font-size:15px;font-weight:600;color:#3B4453">'+esc(r.ko)+'</div></div>';
      }).join('');
    document.body.appendChild(sheet);
    html2canvas(sheet,{scale:2, backgroundColor:'#ffffff'}).then(function(canvas){
      document.body.removeChild(sheet);
      var pdf=new window.jspdf.jsPDF('p','mm','a4');
      var pageW=210, pageH=297, pageCanvasH=Math.floor(canvas.width*pageH/pageW), y=0, first=true;
      while(y<canvas.height){
        var slice=document.createElement('canvas');
        slice.width=canvas.width; slice.height=Math.min(pageCanvasH, canvas.height-y);
        slice.getContext('2d').drawImage(canvas,0,y,canvas.width,slice.height,0,0,canvas.width,slice.height);
        if(!first) pdf.addPage();
        pdf.addImage(slice.toDataURL('image/jpeg',.92),'JPEG',0,0,pageW,slice.height*pageW/canvas.width);
        y+=pageCanvasH; first=false;
      }
      var fileName='오답노트_'+dateStr.split('.').join('')+'.pdf';
      if(window.self===window.top){
        pdf.save(fileName);
      } else {
        var url=URL.createObjectURL(pdf.output('blob'));
        var link=$('pdfReadyLink');
        if(!link){
          link=document.createElement('a'); link.id='pdfReadyLink'; link.className='btn';
          link.target='_blank'; link.rel='noopener';
          btn.insertAdjacentElement('afterend', link);
        }
        link.href=url; link.textContent='📥 PDF 준비 완료 — 눌러서 열기';
      }
      btn.disabled=false; btn.textContent='📄 틀린 단어 PDF 저장';
    }).catch(function(){
      if(sheet.parentNode) sheet.parentNode.removeChild(sheet);
      btn.textContent='저장 실패 — 다시 시도해주세요';
      setTimeout(function(){ btn.textContent='📄 틀린 단어 PDF 저장'; btn.disabled=false; },2500);
    });
  };

  buildHome();
})();
</script>
</body>
